<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="Academic Webpage" />
  <meta name="author" content="senli1073" />
  <meta name="theme-color" content="#16324f" />
  <title id="title"></title>

  <!-- Icon -->
  <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />

  <!-- Bootstrap icons-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Core theme CSS -->
  <link type="text/css" href="static/css/styles.css" rel="stylesheet" />
  <link type="text/css" href="static/css/main.css" rel="stylesheet" />

  <!-- Bootstrap core JS -->
  <script type="text/javascript" src="static/js/bootstrap.bundle.min.js"></script>

  <!-- Polyfill -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>

  <!-- Markdown -->
  <script type="text/javascript" src="static/js/marked.min.js"></script>
  <script type="text/javascript" src="static/js/js-yaml.min.js"></script>

  <!-- MathJax -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEnvironments: true,
        processRefs: true,
        tags: 'all',
        tagSide: 'right',
        tagIndent: '0.8em',
        useLabelIds: true
      }
    };
  </script>
  <script type="text/javascript" src="static/js/tex-svg.js"></script>

  <!-- Core JS -->
  <script type="text/javascript" src="static/js/scripts.js"></script>

  <style>
    /* News 样式 */
    #news-md .card {
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      transition: transform 0.2s ease-in-out;
    }
    #news-md .card:hover {
      transform: translateY(-5px);
    }
    #news-md img {
      max-height: 200px;
      object-fit: cover;
    }
  </style>
</head>

<body id="page-top">
  <!-- Navigation -->
  <nav class="header navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
    <div class="container px-5">
      <a id="page-top-title" class="navbar-brand fw-bold" href="#page-top"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
        aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
        MENU <i class="bi-list"></i>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ms-auto me-4 my-3 my-lg-0">
          <li class="nav-item"><a class="nav-link me-lg-3" href="#page-top">HOME</a></li>
          <li class="nav-item"><a class="nav-link me-lg-3" href="#publications">PUBLICATIONS</a></li>
          <li class="nav-item"><a class="nav-link me-lg-3" href="#awards">AWARDS</a></li>
          <li class="nav-item"><a class="nav-link me-lg-3" href="#team">TEAM</a></li>
          <li class="nav-item"><a class="nav-link me-lg-3" href="#news">NEWS</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="top-section" style="background-image: url('static/assets/img/background.jpeg');">
    <div class="container px-5">
      <div class="hero-shell">
        <p class="hero-kicker">Academic Homepage</p>
        <h1 id="top-section-bg-text" class="text-white display-3 lh-1"></h1>
      </div>
    </div>
  </header>

  <div class="profile-overlap">
    <div class="container px-5">
      <div id="avatar">
        <img class="shadow" src="static/assets/img/photo.png" alt="Portrait of Lehui Chen" />
      </div>
    </div>
  </div>

  <main class="page-shell">
    <section class="content-section section-light" id="home">
      <div class="container px-5">
        <div class="section-panel section-panel-home">
          <header class="section-heading">
            <p class="section-eyebrow">Profile</p>
            <h2 id="home-subtitle"></h2>
          </header>
          <div class="main-body" id="home-md"></div>
        </div>
      </div>
    </section>

    <section class="content-section section-muted" id="publications">
      <div class="container px-5">
        <div class="section-panel">
          <header class="section-heading">
            <p class="section-eyebrow">Scholarship</p>
            <h2 id="publications-subtitle"><i class="bi bi-file-text-fill"></i>&nbsp;PUBLICATIONS</h2>
          </header>
          <div class="main-body" id="publications-md"></div>
        </div>
      </div>
    </section>

    <section class="content-section section-light" id="awards">
      <div class="container px-5">
        <div class="section-panel">
          <header class="section-heading">
            <p class="section-eyebrow">Recognition</p>
            <h2 id="awards-subtitle"><i class="bi bi-award-fill"></i>&nbsp;AWARDS</h2>
          </header>
          <div class="main-body" id="awards-md"></div>
        </div>
      </div>
    </section>

    <section class="content-section section-muted" id="team">
      <div class="container px-5">
        <div class="section-panel">
          <header class="section-heading">
            <p class="section-eyebrow">Collaboration</p>
            <h2 id="team-subtitle"><i class="bi bi-people-fill"></i>&nbsp;TEAM</h2>
          </header>
          <div class="main-body" id="team-md"></div>
        </div>
      </div>
    </section>

    <section class="content-section section-light" id="news">
      <div class="container px-5">
        <div class="section-panel">
          <header class="section-heading">
            <p class="section-eyebrow">Updates</p>
            <h2 id="news-subtitle"><i class="bi bi-newspaper"></i>&nbsp;NEWS</h2>
          </header>
          <div class="main-body" id="news-md"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-bottom site-footer text-center py-5">
    <div class="container px-5">
      <div class="text-white-50 small">
        <div id="copyright-text" class="mb-2"></div>
        <a id="github-link" href="https://github.com/senli1073">Github</a>
        <span class="mx-1">&middot;</span>
        <a id="license-link"
          href="https://github.com/senli1073/senli1073.github.io/blob/main/LICENSE">License</a>
      </div>
    </div>
  </footer>
</body>
</html>
